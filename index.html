<!--
  The short address of the GMS Jatim 1 Dashboard (owner, 2026-11-13). It only forwards to the Apps Script web app,
  keeping everything after the address (?t=…, ?s=…, ?i=…), so invitation, sign-up and WhatsApp links work through it.
  If the web app ever gets a NEW deployment (a new address), change APP below and WEB_APP_URL in apps/gms-app/Auth.js.
-->
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbyk8rudsi8LQ0E3rMVddyncuIsXM6Mimtl7fHBxF61U4CM58_S6eHKek7AioSk8-EhwAQ/exec';
  location.replace(APP + location.search + location.hash);
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #00408C;

  .card { background: #fff; border-radius: 24px; padding: 28px; max-width: 380px; width: 100%; text-align: center; }

  p { font-size: 14px; color: #6B6B6B; margin: 18px 0 16px; }

</style>

<body>
